openapi: 3.0.3
info:
  title: Auth API
  description: Auth API
  version: 1.0.0
servers:
  - url: '{schema}://{host}:{port}{basePath}'
    description: Auth 服务地址
    variables:
      schema:
        description: 协议
        default: http
        enum:
          - http
          - https
      host:
        description: 服务主机地址，域名、主机名或 IP
        default: localhost
      port:
        description: 服务端口号
        default: "8080"
      basePath:
        description: 服务基础路径
        default: /api/v1/auth
tags:
  - name: Auth
paths:
  /login:
    post:
      description: 登录接口
      operationId: auth-login
      requestBody:
        description: 登录参数
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParam"
      responses:
        200:
          description: 登录成功响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  header:
                    $ref: "common.yaml#/components/schemas/ResultHeader"
                  payload:
                    $ref: "#/components/schemas/LoginSuccessPayload"
        default:
          description: 登录出错。详细信息请检查 header。
          content:
            application/json:
              schema:
                type: object
                properties:
                  header:
                    $ref: "common.yaml#/components/schemas/ResultHeader"
      tags:
        - Auth
