components:
  schemas:
    LoginParam:
      description: 登录参数
      type: object
      nullable: false
      properties:
        login:
          description: 登录名。可以是用户名、绑定手机号、绑定邮箱
          type: string
          minLength: 1
          nullable: false
        password:
          description: 客户端 bcrypt 加密后密码
          type: string
          maxLength: 60
          # TODO 暂时注释掉，方便搭建&测试，前端部分搭好后再打开
          # minLength: 60
          nullable: false
      required:
        - login
        - password
      example:
        login: jack03
        password: $2y$10$BFRgXHJU.poYz5bnku8j0eDKj9lOBaI5u1Evbzl9TAvKhmdrbYqjC
    LoginSuccessPayload:
      description: 成功登录响应负载
      type: object
      nullable: false
      properties:
        accessToken:
          description: 访问 token
          type: string
          minLength: 1
          nullable: false
        refreshToken:
          description: 刷新 token
          type: string
          minLength: 1
          nullable: false
      additionalProperties: true
      required:
        - accessToken
        - refreshToken
